[project]
name = "agent-rescue-room"
version = "0.1.0"
description = "Production agent debugging field kit built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.0",
    "langgraph>=1.1.0",
    "langchain-google-genai>=4.2.0",
    "langsmith>=0.7.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rescue = "rescue.__main__:main"
